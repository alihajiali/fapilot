[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fapilot"
version = "0.1.0"
description = "A Django-inspired async application framework built on FastAPI, Tortoise ORM, and Aerich."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ali Hajiali" }]
maintainers = [{ name = "Ali Hajiali" }]
keywords = ["fastapi", "async", "framework", "tortoise-orm", "aerich", "django-inspired"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.141,<0.142",
  "starlette>=0.49,<0.50",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "tortoise-orm[asyncpg]>=1.1,<1.2",
  "aerich[toml]>=0.10,<0.11",
  "uvicorn[standard]>=0.35,<0.36",
  "python-jose>=3.5,<4",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0.20,<0.0.21",
]

[project.urls]
Homepage = "https://github.com/alihajiali/fapilot"
Repository = "https://github.com/alihajiali/fapilot"
Issues = "https://github.com/alihajiali/fapilot/issues"
Changelog = "https://github.com/alihajiali/fapilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cache-redis = ["redis>=5,<7"]
cache-pymemcache = ["pymemcache>=4,<5"]
cache-pylibmc = ["pylibmc>=1.6.3,<2"]
cache = ["redis>=5,<7", "pymemcache>=4,<5", "pylibmc>=1.6.3,<2"]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<9",
  "pytest-anyio>=0.0.0",
  "httpx>=0.28,<0.29",
  "ruff>=0.12,<0.13",
  "pyright>=1.1,<2",
  "twine>=6.2,<7",
]

[project.scripts]
fapilot = "fapilot.cli:main"

[tool.setuptools.packages.find]
include = ["fapilot*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
fapilot = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
# Cache timeout means entry TTL, not an async operation deadline.
"fapilot/cache/backends/*.py" = ["ASYNC109"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["fapilot", "tests"]
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
