name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    env:
      FAPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      FAPILOT_TEST_MEMCACHED: 127.0.0.1:11211

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Memcached client build dependencies
        run: sudo apt-get update && sudo apt-get install -y libmemcached-dev zlib1g-dev

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,cache]"

      - name: Ruff
        run: ruff check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest

      - name: Documentation examples
        run: python docs/check_examples.py

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*
